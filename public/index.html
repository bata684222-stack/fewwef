<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkshopAG — лента</title>
<link rel="icon" type="image/png" href="AG.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- МЕНЮШКА ВХОДА ПЕРВЫМ ЭКРАНОМ -->
<div id="gate">
  <div class="menu-box">
    <img class="logo" src="AG.png" alt="AG">
    <div class="menu-title">WORKSHOP AG</div>
    <div class="menu-sub">реальные люди · фото · json · текст</div>
    <div class="tabs2">
      <button id="g-reg" class="on">РЕГИСТРАЦИЯ</button>
      <button id="g-log">ВОЙТИ</button>
    </div>
    <input id="g-name" placeholder="Ник (от 2 букв)" maxlength="20" autocomplete="username">
    <input id="g-pass" type="password" placeholder="Пароль (от 4 символов)" maxlength="40" autocomplete="current-password">
    <button id="g-go" class="primary">ПРОДОЛЖИТЬ →</button>
    <div class="hint" id="g-err"></div>
  </div>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="app" style="display:none">
  <header class="topmini">
    <img src="AG.png" alt="AG"><b>WORKSHOP AG</b>
    <span class="sp"></span>
    <input id="q" placeholder="Поиск…" maxlength="40">
    <select id="sort"><option value="new">Новые</option><option value="top">Топ</option></select>
  </header>

  <main id="page-feed" class="page">
    <div class="feedtabs">
      <button id="tab-all" class="on">ВСЕ</button>
      <button id="tab-proj">СНАРЯДЫ</button>
      <button id="tab-build">ПОСТРОЙКИ</button>
    </div>
    <div id="feed"></div>
    <div class="hint center" id="empty" style="display:none">Пока пусто — стань первым! Жми ＋</div>
  </main>

  <main id="page-add" class="page" style="display:none">
    <h3>Новый пост — текст + фото + JSON</h3>
    <div class="form">
      <div class="row2">
        <input id="title" placeholder="Название…" maxlength="80">
        <select id="kind"><option value="proj">Снаряд</option><option value="build">Постройка</option></select>
      </div>
      <textarea id="body" rows="3" placeholder="Текст: материалы, скорость…" maxlength="2000"></textarea>
      <label class="file">Фото (png/jpg/webp, до 5MB)<input id="photo" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
      <img id="preview" style="display:none;max-width:100%;border-radius:8px;border:1px solid var(--line)">
      <label class="file">JSON-файл (чертёж для игры, до 5MB)<input id="jsonfile" type="file" accept=".json,application/json"></label>
      <div class="hint" id="jname"></div>
      <button id="publish" class="primary">ОПУБЛИКОВАТЬ</button>
    </div>
  </main>

  <main id="page-me" class="page" style="display:none">
    <h3>Мой аккаунт</h3>
    <div class="form">
      <div class="mehead"><img id="myava" src="AG.png" alt=""><div><b id="myname">—</b><div class="hint" id="mystats"></div></div></div>
      <div id="mylist"></div>
    </div>
  </main>

  <main id="page-set" class="page" style="display:none">
    <h3>Настройки</h3>
    <div class="form">
      <label>Ник<input id="s-name" maxlength="20"></label>
      <label>Новый пароль (пусто = не менять)<input id="s-pass" type="password" maxlength="40"></label>
      <label class="file">Аватар<input id="s-ava" type="file" accept="image/png,image/jpeg,image/webp"></label>
      <button id="s-save" class="primary">СОХРАНИТЬ</button>
      <div class="row2">
        <button id="logout">Выйти</button>
        <button id="delacc" style="color:var(--bad)">Удалить акк</button>
      </div>
      <div class="hint" id="health"></div>
    </div>
  </main>

  <nav id="nav">
    <button id="nav-feed" class="on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Лента</span></button>
    <button id="nav-add" title="Новый пост"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <button id="nav-me"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Акк</span></button>
    <button id="nav-set"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Настройки</span></button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
