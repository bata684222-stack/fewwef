<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="WorkshopAG — лента снарядов и построек от реальных игроков: фото, чертежи в JSON, обсуждения.">
<meta name="theme-color" content="#050506">
<title>WorkshopAG — лента</title>
<link rel="icon" type="image/png" href="AG.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript><p style="padding:16px;text-align:center">Для работы WorkshopAG нужен JavaScript.</p></noscript>

<!-- ВХОД -->
<div id="gate">
  <div class="menu-box" role="dialog" aria-labelledby="gate-title">
    <img class="logo" src="AG.png" alt="AG" width="120" height="120" decoding="async">
    <div class="menu-title" id="gate-title">WORKSHOP AG</div>
    <div class="menu-sub">реальные люди · фото · json · текст</div>
    <div class="seg" role="tablist">
      <button id="g-reg" class="on" type="button" role="tab" aria-selected="true">Регистрация</button>
      <button id="g-log" type="button" role="tab" aria-selected="false">Вход</button>
    </div>
    <input id="g-name" placeholder="Ник (от 2 символов)" aria-label="Ник" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" enterkeyhint="next">
    <div class="pw">
      <input id="g-pass" type="password" placeholder="Пароль (от 4 символов)" aria-label="Пароль" maxlength="40" autocomplete="new-password" enterkeyhint="go">
      <button id="g-eye" class="eye" type="button" aria-label="Показать пароль" data-ic="eye"></button>
    </div>
    <button id="g-go" class="primary wide" type="button">Создать аккаунт →</button>
    <div class="gate-err" id="g-err" role="alert" aria-live="assertive"></div>
  </div>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="app" style="display:none">
  <header class="topbar">
    <button class="brand" id="brand" type="button" aria-label="Наверх"><img src="AG.png" alt="" width="32" height="32" decoding="async"><b>WORKSHOP AG</b></button>
    <div class="search">
      <span class="ico" data-ic="search"></span>
      <input id="q" type="search" placeholder="Поиск по постам…" aria-label="Поиск по постам" maxlength="40" autocomplete="off" enterkeyhint="search">
      <button id="q-clear" class="q-clear" type="button" aria-label="Очистить поиск" data-ic="x" hidden></button>
    </div>
  </header>

  <!-- ЛЕНТА -->
  <main id="page-feed" class="page">
    <div class="seg" role="tablist" aria-label="Тип постов">
      <button id="tab-all" class="on" type="button" role="tab">Все</button>
      <button id="tab-proj" type="button" role="tab">Снаряды</button>
      <button id="tab-build" type="button" role="tab">Постройки</button>
    </div>
    <div class="subbar">
      <span class="hint" id="count"></span>
      <div class="seg seg-sm" role="tablist" aria-label="Сортировка">
        <button id="sort-new" class="on" type="button" role="tab">Новые</button>
        <button id="sort-top" type="button" role="tab">Топ</button>
      </div>
    </div>
    <div id="feed" aria-live="polite"></div>
    <div class="empty" id="empty" hidden></div>
    <div id="sentinel"><div class="spinner" id="more" hidden></div></div>
  </main>

  <!-- НОВЫЙ ПОСТ -->
  <main id="page-add" class="page" style="display:none">
    <h3>Новый пост</h3>
    <div class="form">
      <div class="seg" role="tablist" aria-label="Тип поста">
        <button id="kind-proj" class="on" type="button" role="tab">Снаряд</button>
        <button id="kind-build" type="button" role="tab">Постройка</button>
      </div>

      <label class="fld">Название
        <input id="title" placeholder="Например: Ракета «Стриж»" maxlength="80" autocomplete="off">
        <span class="count" id="title-n">0/80</span>
      </label>

      <label class="fld">Описание
        <textarea id="body" rows="4" placeholder="Материалы, скорость, как собирать…" maxlength="2000"></textarea>
        <span class="count" id="body-n">0/2000</span>
      </label>

      <div class="fld">Фото
        <label class="drop" id="drop-photo">
          <input id="photo" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
          <span class="drop-in"><span class="ico" data-ic="image"></span><b>Выбрать или перетащить фото</b><small>png, jpg, webp, gif · до 5 MB</small></span>
        </label>
        <div class="preview" id="preview-wrap" hidden>
          <img id="preview" alt="Предпросмотр фото" decoding="async">
          <button id="photo-clear" class="icon-btn" type="button" aria-label="Убрать фото" data-ic="x"></button>
        </div>
      </div>

      <div class="fld">JSON-чертёж <small class="opt">для игры</small>
        <label class="drop" id="drop-json">
          <input id="jsonfile" type="file" accept=".json,application/json">
          <span class="drop-in"><span class="ico" data-ic="file"></span><b>Выбрать или перетащить .json</b><small>до 2 MB</small></span>
        </label>
        <div class="chipfile" id="jchip" hidden>
          <span class="ico" data-ic="file"></span><span id="jname"></span>
          <button id="json-clear" class="icon-btn" type="button" aria-label="Убрать файл" data-ic="x"></button>
        </div>
      </div>

      <button id="publish" class="primary wide" type="button" data-ic="send">Опубликовать</button>
    </div>
  </main>

  <!-- ПРОФИЛЬ -->
  <main id="page-me" class="page" style="display:none">
    <div class="profile">
      <img id="myava" src="AG.png" alt="Аватар" width="72" height="72" decoding="async">
      <div class="pinfo">
        <b id="myname">—</b>
        <div class="hint" id="mystats"></div>
      </div>
      <button id="me-edit" class="small" type="button" data-ic="edit">Изменить</button>
    </div>
    <h3>Мои посты</h3>
    <div id="mylist"></div>
  </main>

  <!-- НАСТРОЙКИ -->
  <main id="page-set" class="page" style="display:none">
    <h3>Профиль</h3>
    <div class="form">
      <div class="ava-edit">
        <img id="s-prev" src="AG.png" alt="Аватар" width="72" height="72" decoding="async">
        <div>
          <label class="btn small" for="s-ava"><span class="ico" data-ic="image"></span>Сменить фото</label>
          <input id="s-ava" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          <div class="hint">png, jpg, webp · до 5 MB</div>
        </div>
      </div>
      <label class="fld">Ник
        <input id="s-name" maxlength="20" autocomplete="username" spellcheck="false">
      </label>
      <label class="fld">Новый пароль
        <div class="pw">
          <input id="s-pass" type="password" maxlength="40" autocomplete="new-password" placeholder="Оставь пустым, чтобы не менять">
          <button id="s-eye" class="eye" type="button" aria-label="Показать пароль" data-ic="eye"></button>
        </div>
      </label>
      <button id="s-save" class="primary wide" type="button" data-ic="check">Сохранить</button>
    </div>

    <h3>Аккаунт</h3>
    <div class="form">
      <button id="logout" class="wide" type="button" data-ic="logout">Выйти</button>
      <button id="delacc" class="danger wide" type="button" data-ic="trash">Удалить аккаунт</button>
    </div>
    <div class="hint center" id="health" aria-live="polite"></div>
  </main>

  <!-- ФОРУМЫ -->
  <main id="page-forum" class="page" style="display:none">
    <div class="seg" role="tablist" aria-label="Разделы форума" id="forum-cats"></div>
    <div class="form" style="margin-top:12px">
      <label class="fld">Новая тема
        <input id="th-title" placeholder="О чём поговорим?" maxlength="80" autocomplete="off">
      </label>
      <label class="fld">Текст
        <textarea id="th-body" rows="3" placeholder="Подробности…" maxlength="2000"></textarea>
      </label>
      <button id="th-add" class="primary wide" type="button">Создать тему</button>
    </div>
    <h3>Темы</h3>
    <div id="threads"></div>
    <div class="empty" id="threads-empty" hidden></div>
  </main>

  <!-- ТЕМА ФОРУМА -->
  <main id="page-thread" class="page" style="display:none">
    <button id="th-back" class="small" type="button">← К темам</button>
    <div id="thread-view" style="margin-top:12px"></div>
    <div class="form" style="margin-top:12px">
      <label class="fld">Ответ
        <textarea id="treply" rows="2" placeholder="Написать ответ…" maxlength="1000"></textarea>
      </label>
      <button id="treply-send" class="primary wide" type="button">Ответить</button>
    </div>
  </main>

  <!-- ЛИЧКА -->
  <main id="page-dm" class="page" style="display:none">
    <div id="dm-list-view">
      <h3>Найти человека</h3>
      <div class="form">
        <input id="dm-q" type="search" placeholder="Введи ник…" maxlength="20" autocomplete="off">
        <div id="dm-found"></div>
      </div>
      <h3>Диалоги</h3>
      <div id="dm-convos"></div>
      <div class="empty" id="dm-empty" hidden></div>
    </div>
    <div id="dm-chat-view" hidden>
      <button id="dm-back" class="small" type="button">← К диалогам</button>
      <div class="chathead"><img id="dm-ava" src="AG.png" width="40" height="40" alt=""><b id="dm-name">—</b></div>
      <div id="dm-msgs"></div>
      <div class="cform"><input id="dm-text" placeholder="Сообщение…" maxlength="1000" aria-label="Сообщение" enterkeyhint="send"><button id="dm-send" class="icon-btn primary" type="button" aria-label="Отправить" data-ic="send"></button></div>
    </div>
  </main>

  <nav id="nav" aria-label="Основная навигация">
    <button id="nav-feed" class="on" type="button"><span class="ico" data-ic="home"></span><span>Лента</span></button>
    <button id="nav-forum" type="button"><span class="ico" data-ic="forum"></span><span>Форумы</span></button>
    <button id="nav-add" type="button" title="Новый пост" aria-label="Новый пост"><span class="ico" data-ic="plus"></span></button>
    <button id="nav-dm" type="button"><span class="ico" data-ic="mail"></span><span>ЛС</span><i class="bdot" id="dm-dot" hidden></i></button>
    <button id="nav-me" type="button"><span class="ico" data-ic="user"></span><span>Профиль</span></button>
    <button id="nav-set" type="button"><span class="ico" data-ic="gear"></span><span>Настройки</span></button>
  </nav>

  <button id="totop" class="icon-btn" type="button" aria-label="Наверх" data-ic="up" hidden></button>
</div>

<div id="lightbox" hidden><button class="icon-btn" id="lb-close" type="button" aria-label="Закрыть" data-ic="x"></button><img id="lb-img" alt=""></div>
<div id="toasts" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
